[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xipbr-host"
version = "0.1.0"
description = "xiPBR - Host control software & telemetry dashboard for automated photobioreactor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ALGAeON Team" }
]
keywords = ["photobioreactor", "stm32", "algae", "pbr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
]

dependencies = [
    "customtkinter>=5.2.2",
    "packaging>=24.0",          # CTk assistant
    "pillow>=10.3.0",           # Images
    "pyserial>=3.5",            # UART / USB-CDC
    "matplotlib>=3.8.4",        # Plots & Graphs
    "pydantic>=2.7.0",          # Data validation
    "loguru>=0.7.2",            # Logging
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.xipbr]
modules_dir = "./modules"
db_path = "./data/telemetry.db"
logs_dir = "./data/logs.log"

[project.scripts]
xipbr = "xipbr.main:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []